services:
  calliope:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7200:7200"
    # Copy this file to docker-compose.yml and customize volumes for your system
    # Example local development setup:
    volumes:
      # Database and app data
      - calliope-data:/app/data
      
      #临时下载目录 - 修改为实际路径
      # TEMP_DOWNLOAD_DIR: ./downloads (容器内路径)
      - ./downloads:/app/downloads
      
      #音乐库目录 - 修改为实际路径
      # MUSIC_LIBRARY_DIR: ./music (容器内路径)
      - ./music:/app/music
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/calliope.db
      - TEMP_DOWNLOAD_DIR=/app/downloads
      - MUSIC_LIBRARY_DIR=/app/music
    restart: unless-stopped

# Named volumes for persistent data
volumes:
  calliope-data:

# =====================================================
# 高级示例：配置自定义路径
# =====================================================

# 示例1：使用主机上的自定义路径
# volumes:
#   - calliope-data:/app/data
#   - /path/to/my/downloads:/app/downloads
#   - /path/to/my/music:/app/music

# 示例2：使用NAS挂载
# volumes:
#   - calliope-data:/app/data
#   - /mnt/nas/calliope/downloads:/app/downloads
#   - /mnt/nas/Music:/app/music

# 示例3：配置Navidrome集成
# environment:
#   - NODE_ENV=production
#   - DATABASE_URL=file:/app/data/calliope.db
#   - TEMP_DOWNLOAD_DIR=/app/downloads
#   - MUSIC_LIBRARY_DIR=/app/music
#   - NAVIDROME_URL=http://host.docker.internal:4533
#   - NAVIDROME_USER=admin
#   - NAVIDROME_PASSWORD=yourpassword

# 示例4：配置Discord通知
# environment:
#   - DISCORD_BOT_TOKEN=your_bot_token
#   - DISCORD_CHANNEL_ID=your_channel_id