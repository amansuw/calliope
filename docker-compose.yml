services:
  calliope:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7200:7200"
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/calliope.db
      - NAVIDROME_URL=http://host.docker.internal:4533
      - TEMP_DOWNLOAD_DIR=/app/downloads
      - MUSIC_LIBRARY_DIR=/app/music
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - calliope-data:/app/data
      - /mnt/nvme-ssd/calliope/downloads:/app/downloads
      - /mnt/wd-hdd/Media/Music:/app/music
    restart: unless-stopped

volumes:
  calliope-data:
